<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream of Void</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;700&family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- لایه‌های خواب -->
  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="fog"></div>
  <div class="scanlines"></div>

  <!-- چشم‌های شناور پس‌زمینه -->
  <div class="floating-eye eye-1"></div>
  <div class="floating-eye eye-2"></div>
  <div class="floating-eye eye-3"></div>

  <header class="hero">
    <h1 class="title" data-text="Dream of Void">Dream of Void</h1>
  </header>

  <!-- گالری به صورت داینامیک پر می‌شه -->
  <main class="gallery" id="gallery"></main>

  <div class="lightbox" id="lightbox">
    <div class="stage">
      <div class="curtain curtain-left"><div class="pleats"></div></div>
      <div class="curtain curtain-right"><div class="pleats"></div></div>

      <div class="lightbox-frame">
        <img id="lightbox-img" src="" alt="" />
      </div>
    </div>

    <span class="close">&times;</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
